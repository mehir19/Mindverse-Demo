<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- defs for drop shadow -->
  <defs>
    <filter id="dot-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <!-- small tick mark used inside the white dot to show rotation -->
    <g id="tick">
      <rect x="-1" y="-7" width="2" height="10" rx="1" fill="#bbb"/>
    </g>
  </defs>

  


  <!-- the curved path: from square(right mid) -> to circle(left mid) -> down to panel(top center) -->
  <path id="track"
        d="M0 27.5165C16.1667 27.5165 50.3 27.5165 57.5 27.5165C66.5 27.5165 68 23.0165 68 17.0165C68 11.0165 68 9.01653 68 4.51653C68 0.0165291 71.5 0.516529 78 0.516529C84.5 0.516529 137.5 0.516529 146.5 0.516529C153.7 0.516529 155.5 6.51658 155.5 9.5166V27.5165 M156 104.517C156 126.683 156 172.717 156 179.517C156 188.017 149.5 189.517 145.5 189.517C142.3 189.517 92.8333 189.517 68.5 189.517"
        fill="none" stroke="rgba(10,10,10,0.09)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- visible helper dots at join points (optional visual cues like your reference) -->
  <circle cx="120" cy="80" r="6" fill="#e6ffb3" stroke="#ffffff" stroke-width="1"/>
  <circle cx="302" cy="150" r="6" fill="#e6ffb3" stroke="#ffffff" stroke-width="1"/>
  <circle cx="175" cy="300" r="6" fill="#e6ffb3" stroke="#ffffff" stroke-width="1"/>

  <!-- moving dot group: contains the white dot + little rotating tick -->
  <g id="moving" filter="url(#dot-shadow)">
    <!-- white outer dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <!-- inner tick to show rotation -->
    <g id="rotTick">
      <use href="#tick" />
    </g>

    <!-- animate the tick's rotation continuously to simulate rolling -->
    <animateTransform xlink:href="#rotTick"
                      attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 0 0"
                      to="360 0 0"
                      dur="0.9s"
                      repeatCount="indefinite" />
    <!-- animateMotion will move the whole group along the track -->
    <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track" />
    </animateMotion>
  </g>

  <!-- duplicate a subtle counter-dot moving in opposite direction (optional) -->
  <g id="moving-back" opacity="0.85" filter="url(#dot-shadow)">
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <g id="rotTick2">
      <use href="#tick" transform="scale(0.7)"/>
    </g>
    <animateTransform xlink:href="#rotTick2"
                      attributeName="transform"
                      type="rotate"
                      from="0 0 0"
                      to="-360 0 0"
                      dur="1.1s"
                      repeatCount="indefinite" />
    <!-- this one moves slower and begins slightly delayed, reversed path -->
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" begin="1.2s">
      <!-- using same path but reversed by using keyPoints isn't supported consistently,
           so we create a reverse path by referencing a separate reversed path -->
      <mpath href="#track" />
    </animateMotion>
  </g>

  <!-- OPTIONAL: small visual markers (to better match your artwork) -->
  <!-- fine-tune styles in CSS or by editing the path and coords above -->

</svg>
